services:
  db:
    image: postgres:16-alpine
    container_name: alerta_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-alerta_deepfake}
      POSTGRES_USER: ${DB_USER:-alerta_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debes definir DB_PASSWORD en tu archivo .env}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alerta_user} -d ${DB_NAME:-alerta_deepfake}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    container_name: alerta_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-alerta_user}
      DB_PASSWORD: ${DB_PASSWORD:?Debes definir DB_PASSWORD en tu archivo .env}
      DB_NAME: ${DB_NAME:-alerta_deepfake}
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Debes definir ADMIN_PASSWORD en tu archivo .env}
      SESSION_SECRET: ${SESSION_SECRET:?Debes definir SESSION_SECRET en tu archivo .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
  nginx:
    image: nginx:alpine
    container_name: alerta_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alerta_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@alertadeepfake.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Debes definir PGADMIN_PASSWORD en tu archivo .env}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
volumes:
  db_data:
  pgadmin_data:
  uploads_data:
